<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0c1b"/>
      <stop offset="100%" stop-color="#1e102d"/>
    </linearGradient>
    <linearGradient id="redGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF2E63"/>
      <stop offset="100%" stop-color="#FF0055"/>
    </linearGradient>
    <linearGradient id="goldStar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#FFA500"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="500" height="500" rx="100" fill="url(#bg)"/>
  <rect x="25" y="25" width="450" height="450" rx="85" fill="none" stroke="#2d1b4e" stroke-width="3"/>
  <!-- Clapperboard Body -->
  <rect x="110" y="210" width="280" height="190" rx="18" fill="#1a1429" stroke="#382559" stroke-width="6"/>
  <!-- Film wave / Spectrum inside screen -->
  <path d="M 140 310 Q 180 240, 220 310 T 300 310 T 360 280" fill="none" stroke="url(#redGlow)" stroke-width="7" stroke-linecap="round" filter="url(#glow)"/>
  <!-- Clapper Top Sticks -->
  <g transform="rotate(-12 110 200)">
    <rect x="100" y="140" width="290" height="55" rx="12" fill="#251b3d" stroke="#FF2E63" stroke-width="4"/>
    <polygon points="135,142 165,142 140,193 110,193" fill="url(#redGlow)"/>
    <polygon points="195,142 225,142 200,193 170,193" fill="url(#redGlow)"/>
    <polygon points="255,142 285,142 260,193 230,193" fill="url(#redGlow)"/>
    <polygon points="315,142 345,142 320,193 290,193" fill="url(#redGlow)"/>
  </g>
  <!-- Cinema 5-Star Rating Emblem -->
  <circle cx="330" cy="330" r="38" fill="#140f24" stroke="url(#goldStar)" stroke-width="4" filter="url(#glow)"/>
  <polygon points="330,306 339,324 358,326 343,339 348,358 330,347 312,358 317,339 302,326 321,324" fill="url(#goldStar)"/>
</svg>
